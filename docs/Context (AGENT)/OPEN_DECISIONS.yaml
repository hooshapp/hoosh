status_meanings:
  approved: "Stated choice settled; listed downstream acceptance gates still apply."
  partial: "Some direction supplied; listed details remain unresolved."
  unresolved: "No applicable answer or feasibility acceptance supplied."
  deferred: "Explicitly outside current scope; future intent is not implementation."
decisions:
  - id: PD-01
    topic: sessions_accounting_scope
    status: approved
    questions: ["Q02"]
    options: [combined_selected_apps, per_app, global]
    selected_option: per_app
    original_recommendation: combined_selected_apps
    accepted:
      - "Per-app session count and duration; six ten-minute sessions for two apps yields 120 possible minutes."
    remaining:
      - "Timer overlap/reentry and day-boundary behavior remain PD-02/24."
  - id: PD-02
    topic: session_start_end_and_inactivity_grace
    status: partial
    questions: ["Q03", "Q06"]
    original_recommendation: define_state_machine_and_day_boundary
    accepted:
      - "Open anyway starts elapsed timer; leaving does not pause/end it; switching apps does not transfer it."
      - "Selected-app openings during configured times trigger redirection; ten-minute break means session allowance."
    remaining:
      - "Reopening with active allowance, concurrent timers and wall-clock/native usage timing."
      - "Pause is suggested, not an agreed feature; redirection-to-time mapping missing."
