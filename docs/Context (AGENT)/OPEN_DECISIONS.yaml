# Authorized implementation choices do not relabel the original PM responses.
implementation_defaults_2026_11_10:
  authority: "Ishmum explicitly authorized sensible defaults for RN-08; PM review may revise them."
  record: "../architecture/android-intervention-defaults.md"
  refs: [PD-02, PD-03, PD-04, PD-18, PD-21, PD-24]
  decisions:
    - "Same-app reentry reuses running session; concurrent apps have independent elapsed timers."
    - "Saved-plan IANA timezone; midnight resets; active session retains original deadline/start-day charge."
    - "Beyond-budget bypass uses configured duration; first extra session emits exhaustion/streak-break signal."
    - "Bypass scoped to one app and currently active reasons; new reason reuses remaining session time."
    - "Active occurrence app snapshot preserved; future installations use latest global selection."
  exclusions: [real_auth_binding, ios, reward_computation, quest_recurrence_and_completion, store_approval]

weekly_activation_2026_11_10:
  authority: "Ishmum authorized implementing schedule translation, explicit Apply/Update/Stop and development-owner verification. Engineering choices, not new PM answers."
  record: "../architecture/android-intervention-defaults.md#weekly-plan-activation-continuation--2026-11-10"
  refs: [PD-02, PD-04, PD-18, PD-24]
  decisions:
    - "Complete nonempty weekdays/HH:mm/IANA-zone/session settings required for activation; incomplete drafts remain unapplied."
    - "Selected weekday owns start date; overnight ends next calendar date; intervals are half-open."
    - "DST gaps clamp to first valid instant and collapsed dates/windows skip; overlap uses earlier start/later end once."
    - "Weekly definition persists natively with on-demand occurrence compilation; preview horizon does not expire recurrence."
    - "Explicit Apply/Update confirms revision/spec/selection; Stop retains settings and allowance history but disables recurrence."
  retained_gates: [policy_timezone_migration, production_auth_binding, ios, quest_lifecycle, reward_computation, signed_store_acceptance]

quest_integration_defaults_2026_11_11:
  authority: "Ishmum explicitly requested whole RN09B-D02/D03/D04 and sensible user-facing defaults. Supersedes prior quest Auth/token deferral for this task; not new PM answers."
  record: "../architecture/quest-occurrence-lifecycle.md"
  question_record: "PM_QUESTIONS.md#rn09b-d02d04-implementation-defaults--2026-11-11"
  refs: [PD-04, PD-05, PD-06, PD-09, PD-18, PD-20, PD-21]
  decisions:
    - "Supabase remains sole session/refresh authority; existing private root/controller binds real sessions, with OS secure storage and immediate sign-out invalidation."
    - "Saving does not activate; explicit future dated scheduling snapshots current definition and global native app selection."
    - "Saved-zone recurrence, active snapshots retained through edits, independent reasons and explicit Stop/cancellation."
    - "End releases reason; user confirms completion after end within seven days for +50 non-monetary credits exactly once, self-reported."
    - "Definition deletion wipes copied title/activity; non-content credit metadata remains until account cascade."
    - "PM native quit award amounts and allowance-based streak meaning stay unchanged; no inferred usage or healthy streak from missing telemetry."
  acceptance: "Actual managed-account, native installation, physical accessibility and signed platform checks must each be recorded; automated presets do not establish them."
  retained_ownership: "Anisha owns broader provider setup/onboarding/iOS; this authorized shared integration consumes stable contracts."

quest_device_defaults_2026_11_11:
  authority: "Ishmum authorized D02-D04 user-facing defaults; not additional PM answers."
  decisions:
    - "Explicit account claim stops prior device rules, archives private history, and restores returning accounts stopped. Login/read/signout never claim or erase native rules."
    - "Bounded 256-event diagnostics with a gap count; overflow never disables protection/Open anyway or implies a reward/streak."
    - "SDK bootstrap is fail-closed/retryable; same-subject session replacement fences callbacks, routine refresh retains current scope."
  acceptance: "Native physical checks are separate from managed-account UI, TalkBack, signed release and Anisha's unavailable iOS integration."

quest_controls_2026_11_11:
  authority: "Authorized implementation defaults; not new PM answers."
  decisions:
    - "Explicit first date/current saved definition before Schedule; installed allowance/reset policy retained, otherwise require saved count/minutes and show chosen zone."
    - "Confirm local Stop before account update/deletion; show account-enabled/device-stopped recovery explicitly and never resume on read."
    - "Prune only expired native cancellation metadata; preserve future dates beyond preview."
  ownership: "Anisha retains Auth/signin/onboarding/iOS. Existing D02 foundation awaits her review; managed-account and signed/iOS acceptance stay pending."

history_implementation_defaults_2026_11_13:
  authority: "Ishmum requested full RN09-D02/RN09C-D01-D02 implementation; these are revisable engineering defaults, not new PM answers."
  record: "../architecture/history-measurement.md"
  refs: [PD-11, PD-23, PD-25]
  decisions:
    - "Explicit native collection consent; saved global selection; aggregate-only daily durations/date/count/coverage; no package identity or raw-event upload."
    - "First seven consecutive reported closed local days freeze baseline; try retained previous seven, otherwise collect prospectively."
    - "Later complete seven/28day windows, real day-length normalization, identical selection/zone/series; missing remains unknown."
    - "Negative differences stay increased usage; zero baseline has no percentage; no causal or lifespan claim."
    - "Explicit restart/CAS on selection/device/zone change; reads never initialize or replace a baseline."
    - "Owner-checked local Stop works offline/revoked and clears local collection; existing server summaries remain until replacement/account deletion."
    - "Synced explicit quit receipts deduplicate installation/encounter and retain initial/expired/mid-session counts including cooldown-no-credit quits."
    - "Native bounded56day/32KiB aggregate cache; server56recent days plus frozen baseline until replacement/account deletion."
  source: "Android retained selected-app foreground estimate, policy1; witnessed boundaries do not guarantee lossless OS telemetry."
  retained_gates: [pm_review_of_defaults, ios, managed_auth_sdk_acceptance, prospective_soak, wider_signed_store_acceptance, further_talkback, PD-12_forecast]
