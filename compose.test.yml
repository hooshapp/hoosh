name: disconnect-db-tests

services:
  postgres-test:
    # Managed major observed through MCP: 17. Digest pinned and tested on 2026-11-01.
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_DB: disconnect_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: disconnect_test_admin_only
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - 127.0.0.1:55432:5432
    command: [postgres, -c, max_connections=20]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d disconnect_test]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - test-data:/var/lib/postgresql/data
      - ./services/api/tests/support/bootstrap.sql:/docker-entrypoint-initdb.d/10-fixture.sql:ro
      - ./services/api/db/bootstrap/roles.sql:/docker-entrypoint-initdb.d/20-runtime-role.sql:ro
      - ./services/api/tests/support/runtime.sql:/docker-entrypoint-initdb.d/30-test-access.sql:ro
    labels:
      com.disconnect.scope: isolated-test

volumes:
  test-data:
    name: disconnect_db_test_data
    labels:
      com.disconnect.scope: isolated-test
      com.disconnect.database: disconnect_test
