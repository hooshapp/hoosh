name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Original local design asset integrity
        run: npm run mobile:check-assets
      - name: Portable unit and iOS/Android component tests
        run: npm test
      - name: Isolated shared UI specimen build
        run: npm run mobile:ui:build
      - run: npm run mobile:export

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.10'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install only build-time API generator dependencies
        run: npm ci --workspace @disconnect/api-codegen --include-workspace-root=false
      - run: uv sync --project services/api --frozen
      - run: uv run --project services/api ruff check services/api scripts/export-openapi.py scripts/configure-db-access.py
      - run: uv run --project services/api pytest services/api/tests
      - name: Reproducible OpenAPI and generated HTTP types
        run: npm run api:check-contracts
