[project]
name = "disconnect-api"
version = "0.0.0"
description = "Disconnect FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121.1,<1",
    "httpx2>=2.16.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "pyjwt[crypto]>=2.15.1,<3",
    "sqlalchemy>=2.0.55,<2.1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "alembic>=1.17,<2",
    "jsonschema>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not database'"
markers = ["database: required disposable PostgreSQL checks; explicit local target only"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
